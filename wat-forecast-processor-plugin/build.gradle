    syncTask.destinationDir = layout.buildDirectory.dir("natives").get().asFile
    syncTask.from { configurations.winx8664Natives.collect() { zipTree(it) } }
}*/

tasks.withType(Test).configureEach { task ->
    // task.dependsOn(tasks.named("extractNatives"))

    testLogging{
        test {
            testLogging {
                events "PASSED","FAILED", "SKIPPED"
            }
        }
    }
    jvmArgs ("--enable-preview",
            "-Djava.library.path=" + layout.buildDirectory.get().dir("natives")
    )
}

publishing {
    publications {
        maven(MavenPublication) {
            from components.java
        }
    }
}

jar {
    manifest {
        attributes ("WatPluginMainClass": "HEC.WAT.ForecastProcessor.FIRO_WFP_Plugin")
        //,
        //            'BuildDate':  new Date().format('yyyyMMddHHmmss').toString())
    }
}

